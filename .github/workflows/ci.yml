name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_no_comments.py
      - run: python -m pytest
      - run: python -m bugtrace build-demo
      - run: python -m bugtrace evaluate
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
